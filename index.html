<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IFS Healing</title>

    <meta name="theme-color" content="#8B5CF6" />
    <meta name="description" content="IFS Self-Therapy Program - Personalized healing curriculum" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IFS Healing" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <script>
      (function initializeWebOnlyFeatures() {
        const pushEnabledHosts = ['ifs.aleix.help'];
        const pwaEnabledHosts = ['ifs.aleix.help'];
        const hostname = window.location.hostname;

        if (pwaEnabledHosts.includes(hostname)) {
          const manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.href = '/manifest.json';
          document.head.appendChild(manifestLink);
        }

        window.__IFS_ENABLE_PWA__ = pwaEnabledHosts.includes(hostname);
        window.__IFS_ENABLE_ONESIGNAL__ = pushEnabledHosts.includes(hostname);

        if (!window.__IFS_ENABLE_ONESIGNAL__) return;

        window.OneSignalDeferred = window.OneSignalDeferred || [];

        const oneSignalScript = document.createElement('script');
        oneSignalScript.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
        oneSignalScript.defer = true;
        oneSignalScript.onload = function () {
          window.OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
              appId: "e5dccda5-8644-424e-a0bd-f4144395e258",
            });
          });
        };
        document.head.appendChild(oneSignalScript);
      })();
    </script>

    <script>
      (function applyRedirectParam() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
          const target = decodeURIComponent(redirect);
          window.history.replaceState(null, '', target);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if (window.__IFS_ENABLE_PWA__ && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
